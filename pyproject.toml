[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyquery-research"
version = "0.1.0"
description = "Explainable natural-language routing across SQL, graph, and constrained Python"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
taxi = ["pyarrow>=14"]
llm = ["openai>=1.68"]

[project.scripts]
polyquery = "polyquery.cli:main"

[tool.setuptools.packages.find]
include = ["polyquery*"]
